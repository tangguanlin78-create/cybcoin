# 加密货币大额转账查询 - 配置示例
# 复制为 config.yaml 后填入真实值使用

feishu:
  webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/your-bot-id"
  secret: ""                       # 加签密钥，留空表示不加签
  timeout: 10

# 多链 EVM 配置。Etherscan V2 API：一个 key 通查所有链（请求带 chainid）
# 申请 key：https://etherscan.io/login 后 API Keys 页
chains:
  ethereum:
    label: "以太坊 ETH"
    chainid: 1
    etherscan_base: "https://api.etherscan.io/v2/api"
    etherscan_key: "YOUR_ETHERSCAN_API_KEY"
    explorer_tx: "https://etherscan.io/tx/"
    explorer_address: "https://etherscan.io/address/"
    blockscout_base: "https://eth.blockscout.com/api/v2/"
    rpc_url: ""                    # 可选公共 RPC，用于读 decimals/totalSupply；留空则跳过
  bsc:
    label: "BSC (BNB Chain)"
    chainid: 56
    etherscan_base: "https://api.etherscan.io/v2/api"
    etherscan_key: "YOUR_ETHERSCAN_API_KEY"
    explorer_tx: "https://bscscan.com/tx/"
    explorer_address: "https://bscscan.com/address/"
    blockscout_base: "https://bsc.blockscout.com/api/v2/"
    rpc_url: ""
  polygon:
    label: "Polygon"
    chainid: 137
    etherscan_base: "https://api.etherscan.io/v2/api"
    etherscan_key: "YOUR_ETHERSCAN_API_KEY"
    explorer_tx: "https://polygonscan.com/tx/"
    explorer_address: "https://polygonscan.com/address/"
    blockscout_base: "https://polygon.blockscout.com/api/v2/"
    rpc_url: ""
  arbitrum:
    label: "Arbitrum One"
    chainid: 42161
    etherscan_base: "https://api.etherscan.io/v2/api"
    etherscan_key: "YOUR_ETHERSCAN_API_KEY"
    explorer_tx: "https://arbiscan.io/tx/"
    explorer_address: "https://arbiscan.io/address/"
    blockscout_base: "https://arbitrum.blockscout.com/api/v2/"
    rpc_url: ""
  base:
    label: "Base"
    chainid: 8453
    etherscan_base: "https://api.etherscan.io/v2/api"
    etherscan_key: "YOUR_ETHERSCAN_API_KEY"
    explorer_tx: "https://basescan.org/tx/"
    explorer_address: "https://basescan.org/address/"
    blockscout_base: "https://base.blockscout.com/api/v2/"
    rpc_url: ""
  avalanche:
    label: "Avalanche C-Chain"
    chainid: 43114
    etherscan_base: "https://api.etherscan.io/v2/api"
    etherscan_key: "YOUR_ETHERSCAN_API_KEY"
    explorer_tx: "https://snowtrace.io/tx/"
    explorer_address: "https://snowtrace.io/address/"
    blockscout_base: "https://avalanche.blockscout.com/api/v2/"
    rpc_url: ""

query:
  default_large_threshold_usd: 100000   # 默认大额阈值（USD 价值）
  default_window_hours: 24              # 默认查询窗口（小时，etherscan tokentx 最近 10000 笔内）
  top_holders_limit: 10
  transfer_page_size: 10000             # Etherscan 单次返回上限
  request_timeout: 15
  rate_limit_sleep: 0.25               # 免费版 5 req/s，留 250ms 缓冲

logging:
  level: "INFO"
  file: "logs/whale_alert.log"
